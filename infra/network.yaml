AWSTemplateFormatVersion: '2010-09-09'
Description: Base network (VPC, 2 public + 2 private subnets, IGW, 1 NAT)

Parameters:
  EnvName: { Type: String, Default: dev }
  VpcCidr: { Type: String, Default: 10.0.0.0/16 }
  PublicSubnet1Cidr:  { Type: String, Default: 10.0.0.0/24 }
  PublicSubnet2Cidr:  { Type: String, Default: 10.0.1.0/24 }
  PrivateSubnet1Cidr: { Type: String, Default: 10.0.10.0/24 }
  PrivateSubnet2Cidr: { Type: String, Default: 10.0.11.0/24 }

Mappings:
  AzMap:
    a: { Index: 0 }
    b: { Index: 1 }

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "app-vpc-${EnvName}"

  IGW:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub "app-igw-${EnvName}" }]

  AttachIgw:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref IGW

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet1Cidr
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{ Key: Name, Value: !Sub "app-public-a-${EnvName}" }]

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet2Cidr
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags: [{ Key: Name, Value: !Sub "app-public-b-${EnvName}" }]

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet1Cidr
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{ Key: Name, Value: !Sub "app-private-a-${EnvName}" }]

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet2Cidr
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags: [{ Key: Name, Value: !Sub "app-private-b-${EnvName}" }]

  PublicRT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags: [{ Key: Name, Value: !Sub "app-public-rt-${EnvName}" }]

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PublicRT
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref IGW
    DependsOn: AttachIgw

  AssocPub1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnet1, RouteTableId: !Ref PublicRT }

  AssocPub2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnet2, RouteTableId: !Ref PublicRT }

  EipNat:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  NatGw:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt EipNat.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags: [{ Key: Name, Value: !Sub "app-nat-${EnvName}" }]

  PrivateRT1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags: [{ Key: Name, Value: !Sub "app-private-rt-a-${EnvName}" }]

  PrivateRT2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags: [{ Key: Name, Value: !Sub "app-private-rt-b-${EnvName}" }]

  PrivateDefaultRoute1:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRT1
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGw

  PrivateDefaultRoute2:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRT2
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGw

  AssocPriv1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnet1, RouteTableId: !Ref PrivateRT1 }

  AssocPriv2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnet2, RouteTableId: !Ref PrivateRT2 }

Outputs:
  VpcId:
    Value: !Ref VPC
    Export: { Name: !Sub "${AWS::StackName}-VpcId" }

  PublicSubnet1Id:
    Value: !Ref PublicSubnet1
    Export: { Name: !Sub "${AWS::StackName}-PublicSubnet1Id" }
  PublicSubnet2Id:
    Value: !Ref PublicSubnet2
    Export: { Name: !Sub "${AWS::StackName}-PublicSubnet2Id" }

  PrivateSubnet1Id:
    Value: !Ref PrivateSubnet1
    Export: { Name: !Sub "${AWS::StackName}-PrivateSubnet1Id" }
  PrivateSubnet2Id:
    Value: !Ref PrivateSubnet2
    Export: { Name: !Sub "${AWS::StackName}-PrivateSubnet2Id" }

  PrivateRouteTable1Id:
    Value: !Ref PrivateRT1
    Export: { Name: !Sub "${AWS::StackName}-PrivateRouteTable1Id" }
  PrivateRouteTable2Id:
    Value: !Ref PrivateRT2
    Export: { Name: !Sub "${AWS::StackName}-PrivateRouteTable2Id" }
