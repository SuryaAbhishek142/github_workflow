# .github/workflows/deploy.yml
name: Deploy via parameters file (SHA-injected keys)

on:
  push:
    branches: [ dev, stage, main ]
  workflow_dispatch:
    inputs:
      env:
        description: "dev|stage|prod"
        required: true
        default: "dev"

env:
  CFN_STACK_PREFIX: hello

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read }
    environment: ${{ inputs.env || (github.ref_name == 'main' && 'prod' || github.ref_name == 'stage' && 'stage' || 'dev') }}
    env:
      SELECTED_ENV: ${{ github.event.inputs.env != '' && github.event.inputs.env
        || (github.ref_name == 'main' && 'prod'
        || (github.ref_name == 'stage' && 'stage' || 'dev')) }}

    steps:
      - uses: actions/checkout@v4

      - id: params
        run: |
          case "${{ env.SELECTED_ENV }}" in
            dev)   F=infra/parameters-dev.json  ; NET=network-dev  ;;
            stage) F=infra/parameters-stage.json; NET=network-stage;;
            prod)  F=infra/parameters-prod.json ; NET=network-prod ;;
            *) echo "bad env"; exit 1;;
          esac
          echo "param_file=$F" >> $GITHUB_OUTPUT
          echo "stack_name=${{ env.CFN_STACK_PREFIX }}-${{ env.SELECTED_ENV }}" >> $GITHUB_OUTPUT
          echo "network_stack=$NET" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Validate template
        run: aws cloudformation validate-template --template-body file://infra/stack01.yaml

      - name: Expand params with SHA and create build plan
        id: expand
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          ENV="${{ env.SELECTED_ENV }}"
          ARTIFACT_BUCKET="${{ secrets.ARTIFACT_BUCKET }}"  # not used here, used in upload step

          # fresh output dir
          rm -rf out
          mkdir -p out
          : > out/plan.tsv

          # start from the original params for this env
          cp "${{ steps.params.outputs.param_file }}" out/params-expanded.json

          # For each CodeKey* param, compute a new unique S3 key and append a build plan row
          # Expectation: your local code folders follow "lambda/<name>"
          # and your original ParameterValue looks like "lambda/dev/<name>.zip"

          jq -r '.[] | select(.ParameterKey | startswith("CodeKey")) | "\(.ParameterKey)\t\(.ParameterValue)"' \
            "${{ steps.params.outputs.param_file }}" \
          | while IFS=$'\t' read -r KEY VAL; do
              BASE="$(basename "$VAL")"        # e.g., create_item.zip
              NAME="${BASE%.zip}"              # e.g., create_item
              NEW="lambda/${ENV}/${SHA}/${NAME}.zip"

              # write plan: NAME<TAB>FOLDER<TAB>NEW_S3_KEY
              printf '%s\t%s\t%s\n' "$NAME" "lambda/$NAME" "$NEW" >> out/plan.tsv

              # update the expanded params file in place (change the ParameterValue for KEY)
              tmp=$(mktemp)
              jq --arg k "$KEY" --arg v "$NEW" \
                '(.[] | select(.ParameterKey==$k) | .ParameterValue) = $v' \
                out/params-expanded.json > "$tmp"
              mv "$tmp" out/params-expanded.json
            done

          # expose the expanded params path to later steps
          echo "expanded_params=out/params-expanded.json" >> "$GITHUB_OUTPUT"

      - name: Build & upload lambdas
        run: |
          set -euo pipefail
          ARTIFACT_BUCKET="${{ secrets.ARTIFACT_BUCKET }}"
          while IFS=$'\t' read -r NAME FOLDER S3KEY; do
            echo ">> $NAME from $FOLDER -> s3://$ARTIFACT_BUCKET/$S3KEY"
            test -d "$FOLDER" || { echo "Missing $FOLDER"; exit 1; }
            rm -rf "$FOLDER/build" && mkdir -p "$FOLDER/build"
            if [ -f "$FOLDER/requirements.txt" ]; then pip install -r "$FOLDER/requirements.txt" -t "$FOLDER/build"; fi
            cp -r "$FOLDER"/*.py "$FOLDER/build/" 2>/dev/null || true
            (cd "$FOLDER/build" && zip -r "../../../out/${NAME}.zip" .)
            aws s3 cp "out/${NAME}.zip" "s3://${ARTIFACT_BUCKET}/${S3KEY}" --only-show-errors
          done < out/plan.tsv

      - name: Deploy CloudFormation (using expanded params)
        run: |
          aws cloudformation deploy \
            --stack-name "${{ steps.params.outputs.stack_name }}" \
            --template-file infra/stack01.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              $(jq -r '.[] | "\(.ParameterKey)=\(.ParameterValue)"' "${{ steps.expand.outputs.expanded_params }}") \
              NetworkStackName=${{ steps.params.outputs.network_stack }} \
              CodeBucket=${{ secrets.ARTIFACT_BUCKET }}

      - name: Outputs
        run: |
          aws cloudformation describe-stacks --stack-name "${{ steps.params.outputs.stack_name }}" \
            --query "Stacks[0].Outputs" --output table
      
      - name: Fetch stack outputs
        id: cfn_out
        run: |
          set -euo pipefail
          STACK="${{ steps.params.outputs.stack_name }}"
          mkdir -p out

          # 1) Get outputs as JSON
          OUT_JSON=$(aws cloudformation describe-stacks \
            --stack-name "$STACK" \
            --query 'Stacks[0].Outputs' --output json)
          echo "$OUT_JSON" > out/stack-outputs.json

          # 2) Extract common outputs (adjust keys to your template)
          API=$(jq -r '.[] | select(.OutputKey=="ApiEndpoint") | .OutputValue' out/stack-outputs.json)
          POOL_ID=$(jq -r '.[] | select(.OutputKey=="UserPoolId") | .OutputValue' out/stack-outputs.json)
          CLIENT_ID=$(jq -r '.[] | select(.OutputKey=="UserPoolClientId") | .OutputValue' out/stack-outputs.json)

          # 3) Expose as step outputs (usable by later steps/jobs)
          echo "api=$API" >> "$GITHUB_OUTPUT"
          echo "pool_id=$POOL_ID" >> "$GITHUB_OUTPUT"
          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"

          # 4) Pretty table in the job summary (Actions UI)
          {
            echo "### CloudFormation outputs ($STACK)"
            echo ""
            echo "| Key | Value |"
            echo "|---|---|"
            jq -r '.[] | "| \(.OutputKey) | \(.OutputValue) |"' out/stack-outputs.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload outputs as artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: stack-outputs
          path: out/stack-outputs.json

